<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="canonical" href="https://orbitemploy.com/" />
    
    <title>Orbit Employ - East African Recruitment for Middle East Jobs | Work Abroad</title>
    <meta name="description" content="Orbit Employ connects East African workers from Uganda, Kenya, and Tanzania to verified employers in the Middle East. Apply once, get matched to opportunities. No large upfront fees. 5 recruitment cycles per year." />
    <meta name="author" content="Orbit Employ" />
    <meta name="keywords" content="overseas jobs, Middle East employment, East Africa recruitment, Uganda jobs abroad, Kenya employment, Tanzania work abroad, Gulf jobs, Saudi Arabia jobs, UAE jobs, Qatar jobs, work permit, recruitment agency" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orbitemploy.com/" />
    <meta property="og:title" content="Orbit Employ - East African Recruitment for Middle East Jobs" />
    <meta property="og:description" content="Connect with verified employers in the Middle East. No large upfront fees. Apply once, get matched to opportunities." />
    <meta property="og:image" content="https://orbitemploy.com/og-image.png" />
    <meta property="og:site_name" content="Orbit Employ" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://orbitemploy.com/" />
    <meta name="twitter:title" content="Orbit Employ - East African Recruitment for Middle East Jobs" />
    <meta name="twitter:description" content="Connect with verified employers in the Middle East. No large upfront fees. Apply once, get matched to opportunities." />
    <meta name="twitter:image" content="https://orbitemploy.com/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EmploymentAgency",
      "name": "Orbit Employ",
      "description": "Orbit Employ connects East African workers from Uganda, Kenya, and Tanzania to verified employers in the Middle East.",
      "url": "https://orbitemploy.com",
      "logo": "https://orbitemploy.com/favicon.png",
      "sameAs": [
        "https://www.facebook.com/orbitemploy",
        "https://www.instagram.com/orbitemploy",
        "https://www.linkedin.com/company/orbitemploy"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "UG"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+256790331326",
        "contactType": "customer service",
        "email": "support@orbitemploy.com",
        "availableLanguage": ["English", "Swahili"]
      },
      "areaServed": [
        {"@type": "Country", "name": "Uganda"},
        {"@type": "Country", "name": "Kenya"},
        {"@type": "Country", "name": "Tanzania"},
        {"@type": "Country", "name": "Rwanda"},
        {"@type": "Country", "name": "Burundi"}
      ],
      "serviceType": "International Recruitment",
      "priceRange": "$$"
    }
    </script>

    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What countries does Orbit Employ recruit from?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Orbit Employ recruits workers from Uganda, Kenya, Tanzania, Rwanda, and Burundi for employment opportunities in the Middle East."
          }
        },
        {
          "@type": "Question",
          "name": "What are the eligibility requirements?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Applicants must be between 18-49 years old, have a valid passport, and be a citizen of Uganda, Kenya, Tanzania, Rwanda, or Burundi."
          }
        },
        {
          "@type": "Question",
          "name": "How many recruitment cycles are there per year?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Orbit Employ conducts 5 recruitment cycles per year. All applicants are notified when their recruitment cycle begins."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
